<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F3">
<title>삼슐랭 가이드</title>
<!--
  삼슐랭 가이드 · 앱 v0.1 (2026-10-05) — S01 홈 · S02 등록 · S03 찾기 · S04 족보 커뮤니티 · S05 전체 맛집
  디자인: 삼슐랭 디자인 시스템 v0.1(design.md v1.2 토큰) · 문구: 개발 인계 문서 10.04 개정 · 데이터: 샘플데이터 v3(가상 58곳)
  저장소: Supabase(무료, 모두에게 공유) · 장소 검색: 카카오 JavaScript SDK · 배포: Vercel(무료)
  키는 코드에 없음 → Vercel 환경변수 → /api/config 로 전달(공개용 키만)
  구조: ① 토큰·컴포넌트(디자인 시스템 그대로) → ② 앱 전용 CSS → ③ 데이터 → ④ 저장소 → ⑤ 화면(S01~S05)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ============================================================
   ① TOKENS — design.md 2장 그대로. 단일 라이트 테마(크림 바탕)로 고정.
   ============================================================ */
:root{
  color-scheme: light;
  /* Brand */
  --color-brand-50:#FFF4EC;  --color-brand-100:#FFE3D1;
  --color-brand-400:#F76707; /* 장식 전용. 글자색 금지 */
  --color-brand-600:#C2410C; --color-brand-700:#9A3412;
  /* Neutral */
  --color-bg:#FFF8F3; --color-surface:#FFFFFF; --color-border:#EDE4DD;
  --color-text:#1F1A17; --color-text-sub:#6B625C; --color-text-hint:#8A817A;
  /* Rank */
  --color-rank-1:#F5B700; --color-rank-2:#A7B0BA; --color-rank-3:#C98A5B;
  /* Status */
  --color-success:#237A3B; --color-error:#C92A2A;
  --color-info-bg:#FFF4E5; --color-info-text:#B54708;
  --color-disabled-bg:#F1ECE8; --color-disabled-text:#A39A93;

  /* Type */
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --text-display:800 28px/36px var(--font-sans);
  --text-title:700 22px/30px var(--font-sans);
  --text-heading:700 18px/26px var(--font-sans);
  --text-body:400 16px/24px var(--font-sans);
  --text-label:600 14px/20px var(--font-sans);
  --text-caption:400 13px/18px var(--font-sans);

  /* Space · Radius · Shadow */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-full:999px;
  --shadow-card:0 1px 2px rgba(31,26,23,.04),0 4px 12px rgba(31,26,23,.06);
  --shadow-float:0 8px 24px rgba(194,65,12,.18);

  /* Layout */
  --app-max:440px; --gutter:16px; --touch:44px;
}

/* ============================================================
   ② APP COMPONENTS — 앱(S01~S04)에서 그대로 쓰는 클래스
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:var(--text-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico--16{width:16px;height:16px}
:focus-visible{outline:2px solid var(--color-brand-600);outline-offset:2px}
button{font-family:inherit;letter-spacing:inherit;cursor:pointer}

/* 앱 프레임: 모바일 우선, 최대 440px 가운데 */
.app{max-width:var(--app-max);margin-inline:auto;padding-inline:var(--gutter);background:var(--color-bg)}

/* 타이포 유틸 */
.t-display{font:var(--text-display);letter-spacing:-.02em;margin:0}
.t-display em{font-style:normal;color:var(--color-brand-600)}
.t-title{font:var(--text-title);letter-spacing:-.02em;margin:0}
.t-heading{font:var(--text-heading);letter-spacing:-.02em;margin:0}
.t-label{font:var(--text-label)}
.t-caption{font:var(--text-caption);color:var(--color-text-sub)}
.t-sub{color:var(--color-text-sub)}

/* 3-1 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--touch);border:0;border-radius:var(--radius-md);font:var(--text-label);font-size:15px;padding:0 var(--space-4);transition:background-color .12s}
.btn--primary{height:52px;width:100%;background:var(--color-brand-600);color:#fff;font-size:16px;font-weight:700}
.btn--primary:hover{background:var(--color-brand-700)}
.btn--primary:active{background:var(--color-brand-700)}
.btn--float{box-shadow:var(--shadow-float)}               /* "오늘 여기!" 시그니처 */
.btn--secondary{height:48px;width:100%;background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border)}
.btn--secondary:hover{background:var(--color-bg)}
.btn--text{background:none;color:var(--color-brand-600);font-size:14px;font-weight:600;height:var(--touch);padding:0 var(--space-2)}
.btn:disabled,.btn--disabled{background:var(--color-disabled-bg);color:var(--color-disabled-text);border-color:transparent;box-shadow:none;cursor:not-allowed}
.btn--text:disabled{background:none}
.btn[aria-busy="true"]{pointer-events:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 3-2 선택 칩 */
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{height:40px;padding:0 var(--space-4);border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font:var(--text-label);display:inline-flex;align-items:center;gap:4px}
.chip .ico{display:none;width:16px;height:16px;stroke-width:2.5}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--color-brand-50);border:1.5px solid var(--color-brand-600);color:var(--color-brand-600);padding:0 calc(var(--space-4) - .5px)}
.chip[aria-pressed="true"] .ico,.chip[aria-checked="true"] .ico{display:block}
.q-label{font:var(--text-label);margin:var(--space-4) 0 var(--space-2)}

/* 배지 · 태그 */
.badge{font:var(--text-label);font-size:12px;line-height:18px;background:var(--color-disabled-bg);color:var(--color-text-sub);border-radius:6px;padding:2px 8px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:var(--text-caption);background:var(--color-disabled-bg);color:var(--color-text-sub);border-radius:var(--radius-sm);padding:3px 8px}

/* 3-7 상단 바 · 지역 칩 */
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.topbar__back{display:inline-flex;align-items:center;gap:4px;min-height:var(--touch);background:none;border:0;padding:0;color:var(--color-text);font:var(--text-label);font-size:15px}
.region-chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:0 12px;font:var(--text-label);font-size:13px;color:var(--color-text)}
.region-chip .ico{width:14px;height:14px}

/* 카드 공통 */
.card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}

/* 3-3 TOP3 랭킹 카드 */
.rank-list{display:flex;flex-direction:column;gap:var(--space-3)}
.rank-card{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-4);border:2px solid transparent;text-align:left;width:100%;color:inherit;font:inherit}
.rank-card--first{border-color:var(--color-brand-100)}
.rank-card:hover{border-color:var(--color-brand-100)}
.rank{flex:0 0 36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--font-sans);color:var(--color-text)}
.rank--1{background:var(--color-rank-1)} .rank--2{background:var(--color-rank-2)} .rank--3{background:var(--color-rank-3)}
.rank-card__body{flex:1;min-width:0}
.rank-card__name{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);font:var(--text-heading);letter-spacing:-.02em}
.rank-card__rec{display:flex;align-items:center;gap:4px;color:var(--color-brand-600);font:700 14px/20px var(--font-sans);margin:2px 0 6px}
.rank-card__info{font-size:14px;line-height:21px}
.rank-card__tip{font:var(--text-caption);color:var(--color-text-sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-card__go{align-self:center;color:var(--color-text-sub)}

/* S05 전체 맛집 목록 (신규) — 흰 카드 하나 + 1px 구분선 행 */
.all-list{list-style:none;margin:0;padding:0 var(--space-4)}
.all-item+.all-item{border-top:1px solid var(--color-border)}
.all-item__btn{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:64px;padding:var(--space-3) 0;background:none;border:0;text-align:left;color:inherit;font:inherit}
.all-item__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.all-item__name{display:flex;align-items:center;gap:6px;font:600 16px/24px var(--font-sans);min-width:0}
.all-item__name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.all-item__meta{font:var(--text-caption);color:var(--color-text-sub)}
.all-item__rec{font:700 13px/18px var(--font-sans);color:var(--color-brand-600);white-space:nowrap}
.all-item .ico{width:16px;height:16px;color:var(--color-text-sub)}

/* 3-4 추천 결과 카드 */
.result-card{padding:var(--space-5)}
.result-card__eyebrow{font:700 13px/18px var(--font-sans);color:var(--color-brand-600);margin-bottom:var(--space-1)}
.result-card__name{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.result-card .tags{margin:10px 0}
.info-lines{display:flex;flex-direction:column}
.info-line{display:flex;align-items:center;gap:var(--space-2);font-size:14px;line-height:24px}
.info-line .ico{width:16px;height:16px;color:var(--color-text-sub)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.is-entering{animation:enter .15s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 안내 박스 (대표 팁 · 개인정보 안내) */
.infobox{background:var(--color-info-bg);color:var(--color-info-text);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;line-height:20px}
.infobox--row{display:flex;gap:6px;align-items:center;font-size:13px;line-height:18px}

/* 3-5 입력 필드 */
.field{display:flex;flex-direction:column;gap:6px}
.field__label{font:var(--text-label)}
.field__opt{color:var(--color-text-sub);font-weight:400}
.input{width:100%;height:48px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);padding:0 12px;font:var(--text-body);color:var(--color-text);letter-spacing:-.01em}
textarea.input{height:auto;min-height:88px;padding:12px;resize:vertical}
.input::placeholder{color:var(--color-text-hint)}
.input:focus{outline:none;border:2px solid var(--color-brand-600);padding:0 11px}
textarea.input:focus{padding:11px}
.field.is-error .input{border-color:var(--color-error)}
.field__meta{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2);font:var(--text-caption);color:var(--color-text-sub)}
.field__count.is-over{color:var(--color-error);font-weight:600}
.field__error{display:none;align-items:center;gap:4px;color:var(--color-error)}
.field__error .ico{width:14px;height:14px}
.field.is-error .field__error{display:flex}
.field.is-error .field__help{display:none}
.comment-form{display:flex;gap:var(--space-2);align-items:flex-start}
.comment-form .field{flex:1;min-width:0}
.comment-form .btn{width:64px;height:48px;flex:none}

/* 3-6 방문 팁 리스트 · 추천 */
.tip-list{list-style:none;margin:0;padding:0}
.tip-item{display:flex;gap:10px;padding:var(--space-3) 0;border-bottom:1px solid var(--color-border)}
.avatar{flex:0 0 32px;height:32px;border-radius:var(--radius-full);background:var(--color-brand-50);color:var(--color-brand-600);font:700 13px/1 var(--font-sans);display:flex;align-items:center;justify-content:center}
.tip-item__head{font:var(--text-label)}
.tip-item__head time{font:var(--text-caption);color:var(--color-text-sub)}
.tip-item__body{margin:2px 0 0;font:var(--text-body)}
.rec-row{display:flex;align-items:center;gap:10px}
.rec-row .btn{flex:1;height:52px;font-size:16px;font-weight:700}
.rec-count{font:700 15px/1 var(--font-sans);color:var(--color-brand-600);white-space:nowrap}

/* 3-8 상태 화면 */
.skeleton{display:flex;gap:var(--space-3);padding:var(--space-4)}
.sk{background:var(--color-disabled-bg);border-radius:var(--radius-sm);animation:pulse 1.2s ease-in-out infinite}
.sk--circle{flex:0 0 36px;height:36px;border-radius:var(--radius-full)}
@keyframes pulse{50%{opacity:.5}}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-4)}
.state__emoji{font-size:48px;line-height:1}
.state__icon{width:40px;height:40px;color:var(--color-error)}
.state .btn{margin-top:var(--space-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:min(408px,calc(100% - 32px));background:var(--color-text);color:#fff;border-radius:var(--radius-md);padding:12px 14px;font-size:14px;line-height:20px;display:flex;align-items:center;gap:var(--space-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.toast--static{position:static;transform:none;opacity:1;width:auto}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}



/* ============================================================
   ② APP ONLY
   ============================================================ */
html,body{min-height:100%}
.app{min-height:100vh;padding-bottom:40px;position:relative}
.screen{display:flex;flex-direction:column;gap:var(--space-4)}
.screen > .head{display:flex;flex-direction:column;gap:2px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2)}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.divider{height:1px;background:var(--color-border);margin:var(--space-2) 0}
.link-card{cursor:pointer}
.meta-row{display:flex;flex-wrap:wrap;gap:4px 10px;font:var(--text-caption);color:var(--color-text-sub)}
.meta-row b{color:var(--color-brand-600);font-weight:700}
.info-card{padding:14px 16px}
.cta-bar{position:sticky;bottom:0;margin-inline:calc(var(--gutter) * -1);padding:24px var(--gutter) calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(255,248,243,0),var(--color-bg) 40%);z-index:4}
.pick-list{list-style:none;margin:0;padding:0 var(--space-4)}
.pick-list li+li{border-top:1px solid var(--color-border)}
.pick-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:52px;padding:10px 0;background:none;border:0;text-align:left;color:inherit;font:inherit}
.pick-list b{font-weight:600}
.selected-card{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);border:1.5px solid var(--color-brand-600)}
.done-card{padding:var(--space-6) var(--space-5);text-align:center;display:flex;flex-direction:column;gap:var(--space-2);align-items:center}
.done-card .ico{width:44px;height:44px;color:var(--color-success)}
.notice{background:var(--color-disabled-bg);color:var(--color-text-sub);border-radius:var(--radius-sm);padding:10px 12px;font:var(--text-caption)}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(31,26,23,.4)}
.sheet{width:100%;max-width:var(--app-max);background:var(--color-surface);border-radius:20px 20px 0 0;padding:var(--space-5) var(--gutter) calc(var(--space-5) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--space-3);animation:enter .15s ease-out}
.sheet__head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2)}
.icon-btn{width:44px;height:44px;margin:-10px -10px 0 0;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:var(--color-text);border-radius:var(--radius-md)}
.region-opt{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);width:100%;min-height:52px;padding:0 var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font:var(--text-label);font-size:16px;color:var(--color-text)}
.region-opt[aria-checked="true"]{border:1.5px solid var(--color-brand-600);background:var(--color-brand-50);color:var(--color-brand-600)}
.region-opt .ico{display:none}.region-opt[aria-checked="true"] .ico{display:block}
.sheet .duo{margin-top:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.btn{text-decoration:none}
.foot-note{font:var(--text-caption);color:var(--color-text-hint);text-align:center;margin-top:var(--space-6)}
</style>

</head>

const KST = 9 * 3600e3, H = 3600e3;
function kst(ts){ const d = new Date(ts + KST); return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes()}; }
const p2 = n => String(n).padStart(2,"0");
const fmt = ts => { const k = kst(ts); return `${p2(k.m)}.${p2(k.d)} ${p2(k.h)}:${p2(k.mi)}`; };
const dayKey = ts => { const k = kst(ts); return `${k.y}${p2(k.m)}${p2(k.d)}`; };
function baseTime(now){ const k = kst(now); let b = Date.UTC(k.y, k.m-1, k.d, 18) - KST; if(b > now) b -= 24*H; return b; }
const BASE = baseTime(Date.now());

const BASE_PT = {
  DEMO_YONGSAN:      {name:"용산역", lat:37.5299, lng:126.9648, radius:2000},
  DEMO_YANGPYEONG_A: {name:null,     lat:37.4925, lng:127.4919, radius:20000},
};
function distM(a, b){ const R6 = 6371000, t = Math.PI/180, dLat = (b.lat-a.lat)*t, dLng = (b.lng-a.lng)*t;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2; return 2*R6*Math.asin(Math.sqrt(x)); }
function fromRow(x){
  const bp = BASE_PT[x.region_id]; let wk = null;
  if(bp && bp.name && x.lat && x.lng){ wk = Math.max(1, Math.round(distM(bp, {lat:x.lat, lng:x.lng}) * 1.3 / 67)); if(wk > 30) wk = null; }
  return {id:x.id, n:x.name, rg:x.region_id, c:x.category_label || "기타", a:x.address, t:x.time_slots, p:x.max_party, w:null, b:x.price_band,

}

function stats(rid){
  const s0 = SS.get(rid) || {tot:0, rc:0, last:0, cc:0};
  let {tot, rc, last, cc} = s0;
  if(S.mode === "remote"){
    const c = S.counts.get(rid); if(c){ tot += c.rec; cc += c.tip; }
    for(const e of S.recent) if(e.rid === rid){ rc++; last = Math.max(last, e.ts); }
  } else {
    for(const e of local.E){ if(e.rid !== rid) continue;
      if(e.ty === "rec"){ tot++; if(e.ts >= BASE - 72*H && e.ts <= BASE){ rc++; last = Math.max(last, e.ts); } } else cc++; }
  }
  return {tot, rc, last, cc};
}

  const sample = SAMPLE.E.filter(e => e.rid === rid && e.ty === "tip");
  const more = S.mode === "remote" ? (S.tips.get(rid) || []) : local.E.filter(e => e.rid === rid && e.ty === "tip");
  return sample.concat(more).sort((a,b) => b.ts - a.ts || (a.id < b.id ? 1 : -1));
}

/* --- Supabase 읽기 --- */
function must(res){ if(res.error) throw res.error; return res.data; }
async function loadAll(){
  const sb = S.sb, from = new Date(BASE - 72*H).toISOString(), to = new Date(BASE).toISOString();
  const recentPages = async () => { const out = []; for(let i = 0; i < 10; i++){
      const d = must(await sb.from("events").select("restaurant_id,created_at").eq("type","rec").gte("created_at", from).lte("created_at", to).order("created_at").range(i*1000, i*1000+999));
      out.push(...d); if(d.length < 1000) break; } return out; };
  const [rows, counts, recent, mine] = await Promise.all([
    sb.from("restaurants").select("*").order("created_at").limit(1000).then(must),
    sb.from("event_counts").select("*").limit(1000).then(must),
    recentPages(),
    sb.from("events").select("restaurant_id").eq("type","rec").eq("user_id", S.uid).eq("day_kst", today()).limit(1000).then(must),
  ]);
  S.dbR = rows.map(fromRow);
  S.counts = new Map(counts.map(c => [c.restaurant_id, {rec:+c.rec_total, tip:+c.tip_total}]));
  S.recent = recent.map(e => ({rid:e.restaurant_id, ts:Date.parse(e.created_at)}));
  S.mine = new Set(mine.map(e => e.restaurant_id));
}
async function reload(){
  try{ await loadAll(); S.loadError = false; }catch(e){ console.warn(e); S.loadError = true; }
  refresh();
}
async function loadTips(rid){
  if(S.mode !== "remote") return;
  S.tipsState.set(rid, "loading");
  try{
    const d = must(await S.sb.from("events").select("id,alias,body,created_at").eq("type","tip").eq("restaurant_id", rid).order("created_at", {ascending:false}).limit(200));
    S.tips.set(rid, d.map(x => ({id:x.id, rid, ty:"tip", al:x.alias, x:x.body, ts:Date.parse(x.created_at)})));
    S.tipsState.set(rid, "ok");
  }catch(e){ S.tipsState.set(rid, "error"); }
}

/* --- 쓰기 --- */
function bump(rid, k){ const c = S.counts.get(rid) || {rec:0, tip:0}; c[k]++; S.counts.set(rid, c); }
function saveLocal(){ lsSet("sg.data.v2", local); }
/* 결과: "ok" | "dup"(오늘 이미 추천) */
async function addRec(rid){
  if(S.mode !== "remote"){ if(recToday(rid)) return "dup"; local.E.push({id:"l-"+rid8(), rid, ty:"rec", ts:Date.now()}); saveLocal(); return "ok"; }
  const {error} = await S.sb.from("events").insert({restaurant_id:rid, type:"rec", user_id:S.uid});
  if(error){ if(error.code === "23505"){ S.mine.add(rid); return "dup"; } throw error; }
  S.mine.add(rid); bump(rid, "rec"); return "ok";
}
async function addTip(rid, text, alias){
  alias = alias || ALIAS_DEFAULT;
  if(S.mode !== "remote"){ local.E.push({id:"l-"+rid8(), rid, ty:"tip", al:alias, x:text, ts:Date.now()}); saveLocal(); return; }
  const x = must(await S.sb.from("events").insert({restaurant_id:rid, type:"tip", user_id:S.uid, alias, body:text}).select("id,alias,body,created_at").single());
  const list = S.tips.get(rid) || []; list.unshift({id:x.id, rid, ty:"tip", al:x.alias, x:x.body, ts:Date.parse(x.created_at)}); S.tips.set(rid, list);
  bump(rid, "tip");
}
/* 결과: {id, dup:false} 새로 생김 | {id, dup:true} 같은 카카오 장소가 이미 있음 */
async function addRestaurant(row){
  if(S.mode !== "remote"){ const r = fromRow({...row, id:"l-"+Date.now().toString(36)+rid8()}); local.R.push(r); saveLocal(); return {id:r.id, dup:false}; }
  const res = await S.sb.from("restaurants").insert({...row, created_by:S.uid}).select("*").single();
  if(res.error){
    if(res.error.code === "23505" && row.place_id){
      const ex = must(await S.sb.from("restaurants").select("*").eq("region_id", row.region_id).eq("provider","kakao").eq("place_id", row.place_id).limit(1));
      if(ex[0]){ if(!S.dbR.some(r => r.id === ex[0].id)) S.dbR.push(fromRow(ex[0])); return {id:ex[0].id, dup:true}; }
    }
    throw res.error;
  }
  S.dbR.push(fromRow(res.data)); return {id:res.data.id, dup:false};
}

/* --- 시작: /api/config 에서 공개 설정을 받아 연결 --- */
async function boot(){
  let cfg = null;
  try{ const r = await fetch("/api/config", {cache:"no-store"}); if(r.ok) cfg = await r.json(); }catch(e){}
  if(cfg && cfg.supabaseUrl && cfg.supabaseKey && window.supabase){
    const sbUrl = String(cfg.supabaseUrl).trim().replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, "");
    S.sb = window.supabase.createClient(sbUrl, String(cfg.supabaseKey).trim(), {auth:{persistSession:false, autoRefreshToken:false}});
    S.mode = "remote"; await reload();
  } else { S.mode = "local"; refresh(); }
  if(cfg && cfg.kakaoKey) loadKakao(cfg.kakaoKey);
  /* 홈·전체 맛집을 보고 있으면 1분마다 새로 불러오기 (실시간 연결 대신 → 무료 한도 안전) */
  setInterval(() => { if(S.mode === "remote" && document.visibilityState === "visible" && (current.name === "home" || current.name === "all")) reload(); }, 60000);
}

      <div class="field" id="fd-tip" data-max="100"><label class="field__label" for="in-tip">한 줄 팁 <span class="field__opt">(선택)</span></label>
        <textarea class="input" id="in-tip" rows="2" placeholder="추천 메뉴나 방문 팁을 한 줄로 남겨주세요"></textarea>
        <div class="field__meta"><span class="field__help"></span><span class="field__error">${icon("alert-circle")}한 줄 팁은 100자 이내로 작성해주세요.</span><span class="field__count num">0/100</span></div></div>
      <div class="field"><span class="field__label" id="lb-g">이런 점이 좋아요 <span class="field__opt">(선택)</span></span><span class="t-caption">빠른식사, 혼밥, 단체가능 등 특징을 골라주세요.</span>
        <div class="chips" id="ch-g" aria-labelledby="lb-g">${TAGS.map(([v,l]) => chipBtn(v,l,false,"multi")).join("")}</div></div>
      <div class="cta-bar"><button class="btn btn--primary" type="submit" id="reg-go"${readOnly() ? " disabled" : ""}>맛집 등록하기</button></div>
    </form>
  </section>`;
  bindCommon();

  /* 식당 이름: 카카오맵 장소 검색(기본) → 실패·결과 없음이면 직접 입력(M4 대안)으로 전환 */
  const box = $("#name-box"), help = $("#name-help");
  const kakaoMode = () => !!S.places && !F.manual;
  const switchLink = () => S.places ? `<button class="btn btn--text" type="button" id="to-manual" style="padding:0">직접 입력하기</button>` : "";
  function bindSwitch(){
    const m = $("#to-manual", help); if(m) m.onclick = () => { F.manual = true; renderName(); $("#in-name").focus(); };
    const k = $("#to-kakao"); if(k) k.onclick = () => { F.manual = false; renderName(); $("#in-name").focus(); };
  }
  function renderName(){
    $("#fd-name").classList.remove("is-error");
    if(F.picked || F.kakao){
      const r = F.picked ? getR(F.picked) : null, p = F.kakao;
      const nm = r ? r.n : p.place_name, ad = r ? r.a : (p.road_address_name || p.address_name);
      box.innerHTML = `<div class="card selected-card"><div style="min-width:0"><span class="t-caption" style="color:var(--color-brand-600);font-weight:600">선택한 식당</span>
        <div style="font-weight:700">${esc(nm)}</div>${ad ? `<div class="t-caption">${esc(ad)}</div>` : ""}</div>
        <button class="btn btn--text" type="button" id="unpick" style="flex:none">다른 식당 선택</button></div>`;
      help.innerHTML = F.picked ? `<p class="t-caption" style="margin:0">이미 등록된 맛집이라 추천 1개가 더해져요.</p>` : `<p class="t-caption" style="margin:0">장소 정보 출처: 카카오맵</p>`;
      $("#unpick").onclick = () => { F.picked = null; F.kakao = null; renderName(); $("#in-name").focus(); };
      return;
    }
    if(kakaoMode()){
      box.innerHTML = `<div style="display:flex;gap:8px"><input class="input" id="in-name" type="search" enterkeyhint="search" placeholder="식당 이름을 검색해주세요" autocomplete="off" value="${esc(F.name)}" style="flex:1;min-width:0">
        <button class="btn btn--secondary" type="button" id="do-search" style="width:72px;flex:none">검색</button></div>`;
      const input = $("#in-name");
      input.oninput = () => { F.name = input.value; $("#fd-name").classList.remove("is-error"); };
      input.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); doSearch(); } };
      $("#do-search").onclick = doSearch;
      help.innerHTML = ""; return;
    }
    box.innerHTML = `<input class="input" id="in-name" type="text" placeholder="식당 이름을 입력해주세요" autocomplete="off" value="${esc(F.name)}">`;
    const input = $("#in-name");
    input.oninput = () => { F.name = input.value; $("#fd-name").classList.remove("is-error"); renderMatches(); };
    renderMatches();
  }
  async function doSearch(){
    const q = F.name.trim(), er = $("#er-name span");
    if(!q){ er.textContent = "검색할 식당 이름을 입력해주세요."; $("#fd-name").classList.add("is-error"); return; }
    const btn = $("#do-search"); if(btn.getAttribute("aria-busy")) return;
    busy(btn, ""); help.innerHTML = `<p class="t-caption" role="status" style="margin:4px 0 0">식당을 검색하고 있어요.</p>`;
    try{
      const data = await searchPlaces(q);
      if(!data.length){ help.innerHTML = `<p class="t-caption" style="margin:4px 0 0">검색한 식당이 없어요. 식당 이름이나 지역을 바꿔보세요.</p>${switchLink()}`; }
      else {
        help.innerHTML = `<div class="card" style="margin-top:4px"><ul class="pick-list">${data.map((p,i) => `<li><button type="button" data-k="${i}"><b>${esc(p.place_name)}</b><span class="t-caption">${esc(p.road_address_name || p.address_name)}</span></button></li>`).join("")}</ul></div>
          <p class="t-caption" style="margin:8px 0 0">찾는 식당이 없나요? ${switchLink()}</p>`;
        $$("[data-k]", help).forEach(b => b.onclick = () => {
          const p = data[+b.dataset.k];
          const ex = allR().find(r => r.rg === S.region && r.pid === p.id);
          if(ex) F.picked = ex.id; else F.kakao = p;
          if(!F.c){ const code = (CATS.find(c => c[1] === kakaoCat(p.category_name)) || ["OTHER"])[0]; F.c = code;
            $$("#ch-c .chip").forEach(c => c.setAttribute("aria-checked", c.dataset.v === code)); }
          renderName();
        });
      }
    }catch(e){ help.innerHTML = `<p class="t-caption" style="margin:4px 0 0;color:var(--color-error)">식당 검색을 완료하지 못했어요. 다시 시도해주세요.</p>${switchLink()}`; }
    finally{ unbusy(btn); bindSwitch(); }
  }
  function renderMatches(){
    const q = norm(F.name);
    const back = S.places ? `<p class="t-caption" style="margin:8px 0 0"><button class="btn btn--text" type="button" id="to-kakao" style="padding:0">카카오맵에서 검색하기</button></p>` : "";
    if(!q){ help.innerHTML = back; bindSwitch(); return; }
    const hits = inRegion().filter(r => norm(r.n).includes(q)).slice(0,5);
    if(hits.length){
      help.innerHTML = `<p class="t-caption" style="margin:2px 0 6px">이미 등록된 맛집이 있어요. 같은 곳이면 골라주세요.</p>
        <div class="card"><ul class="pick-list">${hits.map(r => `<li><button type="button" data-pick="${esc(r.id)}"><b>${esc(r.n)}</b>${r.a ? `<span class="t-caption">${esc(r.a)}</span>` : ""}</button></li>`).join("")}</ul></div>
        ${hits.some(r => norm(r.n) === q) ? "" : newPlace()}${back}`;
    } else help.innerHTML = newPlace() + back;
    $$("[data-pick]", help).forEach(b => b.onclick = () => { F.picked = b.dataset.pick; renderName(); });
    const a = $("#in-addr"); if(a){ a.value = F.addr; a.oninput = () => { F.addr = a.value; }; }
    bindSwitch();
  }
  const newPlace = () => `<div class="infobox" style="margin-top:8px">처음 등록되는 맛집이에요. 새 맛집으로 등록돼요.</div>
    <div class="field" style="margin-top:12px"><label class="field__label" for="in-addr">위치 <span class="field__opt">(선택)</span></label>
      <input class="input" id="in-addr" type="text" maxlength="50" placeholder="예: 용산역 2번 출구 앞 골목" autocomplete="off"></div>`;
  renderName();
  refreshPlaces = () => { if(current.name === "register" && !F.picked && !F.kakao && !F.manual && $("#name-box")) renderName(); };

  bindChipGroup($("#ch-t"), (v,on) => { on ? F.t.add(v) : F.t.delete(v); $("#fd-t").classList.toggle("is-error", false); });
  bindChipGroup($("#ch-p"), v => { F.p = +v; $("#fd-p").classList.remove("is-error"); });
  bindChipGroup($("#ch-b"), v => { F.b = v; $("#fd-b").classList.remove("is-error"); });
  bindChipGroup($("#ch-c"), v => { F.c = v; });
  bindChipGroup($("#ch-g"), (v,on) => { on ? F.g.add(v) : F.g.delete(v); });
  bindCounter($("#fd-m"), v => F.m = v); bindCounter($("#fd-tip"), v => F.tip = v);

  $("#reg").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#reg-go"); if(btn.getAttribute("aria-busy")) return;
    const errs = [];
    const nm = F.name.trim();
    const setNameErr = msg => { $("#er-name span").textContent = msg; $("#fd-name").classList.add("is-error"); errs.push($("#fd-name")); };
    if(!F.picked && !F.kakao){
      if(kakaoMode()) setNameErr(nm ? "등록할 식당을 선택해주세요." : "검색할 식당 이름을 입력해주세요.");
      else if(!nm) setNameErr("식당 이름을 입력해주세요."); else if(len(nm) > 30) setNameErr("식당 이름은 30자 이내로 작성해주세요.");
    }
    if(!F.t.size){ $("#fd-t").classList.add("is-error"); errs.push($("#fd-t")); }
    if(!F.p){ $("#fd-p").classList.add("is-error"); errs.push($("#fd-p")); }
    if(!F.b){ $("#fd-b").classList.add("is-error"); errs.push($("#fd-b")); }
    if(len(F.m.trim()) > 30) errs.push($("#fd-m"));
    if(len(F.tip.trim()) > 100) errs.push($("#fd-tip"));
    if(errs.length){ errs[0].scrollIntoView({behavior:"smooth", block:"center"}); return; }

    /* 이미 있는 식당: 목록에서 고름 / 같은 카카오 장소 / (직접 입력) 같은 지역 + 정규화 이름 */
    let existingId = F.picked || (!F.kakao ? (inRegion().find(r => norm(r.n) === norm(nm)) || {}).id : null);
    busy(btn, "등록 중…");
    try{
      if(!existingId){
        const p = F.kakao;
        const row = {region_id:S.region, time_slots:[...F.t].join(","), max_party:F.p, price_band:F.b,
          menu:F.m.trim() || null, tags:[...F.g].join(","), tip:F.tip.trim() || null,
          category_label: F.c ? lab(CATS, F.c) : (p ? kakaoCat(p.category_name) : "기타"),
          name: p ? [...p.place_name].slice(0,30).join("") : nm,
          address: p ? (p.road_address_name || p.address_name || null) : (F.addr.trim() || null),
          provider: p ? "kakao" : null, place_id: p ? String(p.id) : null, map_link: p ? safeLink(p.place_url) : null,
          lat: p ? +p.y : null, lng: p ? +p.x : null};
        const res = await addRestaurant(row);
        if(!res.dup){ await addRec(res.id); /* A2: 신규 등록 = 등록자의 추천 1회 */ return done(res.id, "맛집을 등록했어요!"); }
        existingId = res.id;
      }
      const r2 = await addRec(existingId);
      if(r2 === "dup"){ toast("오늘 이미 추천한 맛집이에요. 방문 팁을 남겨보세요."); current.onBack = null; S.stack = [{name:"home", args:{}}]; current = {name:"home", args:{}}; go("detail", {rid:existingId}); return; }
      done(existingId, "이미 등록된 맛집이에요. 추천 1개를 더했어요.");
    }catch(err){ console.warn(err); unbusy(btn); toast("맛집을 등록하지 못했어요. 입력한 내용을 유지했으니 다시 시도해주세요."); }
  };
  function done(rid, msg){
    current.onBack = null;
    view.innerHTML = `<section class="screen">${topbar("")}
      <div class="card done-card is-entering">${icon("check-circle")}<h1 class="t-title">${msg}</h1>
        <p class="t-sub" style="margin:0">등록한 맛집에 방문 팁을 더해보세요.</p>
        <button class="btn btn--primary" type="button" id="see" style="margin-top:8px">등록한 맛집 보기</button>
        <button class="btn btn--secondary" type="button" id="home">홈으로</button></div></section>`;
    bindCommon();
    $("#see").onclick = () => { S.stack = [{name:"home", args:{}}]; current = {name:"home", args:{}}; go("detail", {rid}); };
    $("#home").onclick = () => { S.stack = []; go("home", {}, false); };
    toast(msg);
  }
},

/* ---------------- S03 맛집 찾기 ---------------- */
find(args){
  const sel = Object.assign({t:null, p:null, b:null}, args.sel || {});
  let cands = [], cur = null, shownFor = null;
  view.innerHTML = `<section class="screen">
    ${topbar("")}
    <div class="head"><h1 class="t-title">맛집 찾기</h1><p class="t-caption" style="margin:0">조건을 고르면 오늘 갈 맛집을 추천해드려요.</p></div>
    <div id="filters">
      <div class="q-label" style="margin-top:0" id="q-t">언제 먹나요?</div><div class="chips" data-k="t" role="radiogroup" aria-labelledby="q-t">${TIME.map(([v,l]) => chipBtn(v,l,sel.t === v)).join("")}</div>
      <div class="q-label" id="q-p">몇 명이 함께하나요?</div><div class="chips" data-k="p" role="radiogroup" aria-labelledby="q-p">${PARTY.map(([v,l]) => chipBtn(v,l,sel.p == v)).join("")}</div>
      <div class="q-label" id="q-b">1인 예산은 얼마인가요?</div><div class="chips" data-k="b" role="radiogroup" aria-labelledby="q-b">${BAND.map(([v,l]) => chipBtn(v,l,sel.b === v)).join("")}</div>
    </div>
    <div class="sec-head" style="align-items:center"><div class="t-caption" id="sum"></div><button class="btn btn--text" type="button" id="reset">필터 초기화</button></div>
    <button class="btn btn--primary btn--float" type="button" id="go">오늘 여기!</button>
    <div id="res"></div>
  </section>`;
  bindCommon();
  const ready = () => sel.t && sel.p && sel.b;
  const key = () => `${sel.t}|${sel.p}|${sel.b}|${S.region}`;
  const match = () => allR().filter(r => r.rg === S.region && String(r.t).split(",").includes(sel.t) && r.p >= sel.p && r.b === sel.b);
  function summary(){
    cands = ready() ? match() : [];
    $("#sum").innerHTML = ready() ? `<b style="color:var(--color-text)">${lab(TIME,sel.t)} · ${lab(PARTY,sel.p)} · ${lab(BAND,sel.b)}</b><br><span class="num">조건에 맞는 맛집 ${cands.length}곳</span>` : "시간대, 인원, 가격대를 골라주세요.";
    $("#go").disabled = !ready();
    current.args.sel = {...sel};
  }
  $$("#filters .chips").forEach(g => bindChipGroup(g, v => {
    sel[g.dataset.k] = g.dataset.k === "p" ? +v : v; summary();
    if(shownFor && shownFor !== key()){ shownFor = null; cur = null; $("#res").innerHTML = `<div class="infobox">조건을 바꿨어요. ‘오늘 여기!’를 눌러 다시 추천받으세요.</div>`; }
  }));
  $("#reset").onclick = () => { Object.assign(sel, {t:null,p:null,b:null}); $$("#filters .chip").forEach(c => c.setAttribute("aria-checked","false")); summary(); $("#res").innerHTML = ""; shownFor = null; cur = null; };
  const toFilters = () => $("#filters").scrollIntoView({behavior:"smooth", block:"start"});

  function render(r, note){
    const res = $("#res");
    if(!r){
      res.innerHTML = `<div class="card state is-entering"><span class="state__emoji" aria-hidden="true">🍽️</span>
        <h2 class="t-heading">조건에 맞는 맛집이 없어요.</h2><p class="t-sub" style="margin:0">시간대, 인원, 가격대를 바꿔보세요.</p>
        <button class="btn btn--primary" type="button" data-a="reg">맛집 등록하기</button><button class="btn btn--text" type="button" data-a="filters" style="margin:0">필터 바꾸기</button></div>`;
    } else {
      const s = stats(r.id);
      const tags = String(r.g || "").split(",").filter(Boolean).map(g => `<span class="tag">${lab(TAGS,g)}</span>`).join("");
      const lines = [
        r.m && ["utensils", `추천 메뉴 · ${esc(r.m)}`],
        ["wallet", priceLine(r)],
        r.wk && r.bp && ["footprints", `${esc(r.bp)}에서 도보 약 ${r.wk}분`],
        r.a && ["map-pin", esc(r.a)],
        r.h && ["clock", `영업시간 · ${esc(r.h)}`],
      ].filter(Boolean).map(([i,t]) => `<div class="info-line num">${icon(i)}${t}</div>`).join("");
      res.innerHTML = `<article class="card result-card is-entering">
        <div class="result-card__eyebrow">오늘은 여기 어때요?</div>
        <div class="result-card__name"><button type="button" data-a="detail" style="background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit"><h2 class="t-title">${esc(r.n)}</h2></button><span class="badge">${esc(r.c)}</span></div>
        <div class="meta-row num" style="margin-top:4px"><span><b>추천 ${s.tot}</b></span><span>방문 팁 ${s.cc}개</span></div>
        ${tags ? `<div class="tags">${tags}</div>` : `<div style="height:10px"></div>`}
        <div class="info-lines">${lines}</div>
        ${r.h ? `<p class="t-caption" style="margin:2px 0 0 24px">방문 전 영업시간을 확인해주세요.</p>` : ""}
        <div class="infobox" style="margin-top:10px">${r.tip ? esc(r.tip) : "아직 한 줄 팁이 없어요. 방문 후 남겨주세요."}</div>
        <div class="duo">${mapBtn(r)}<button class="btn btn--secondary" type="button" data-a="detail">방문 팁 보기</button></div>
        ${note ? `<p class="t-caption" style="margin:10px 0 0;text-align:center">이 조건에 맞는 다른 맛집은 아직 없어요.</p><button class="btn btn--text" type="button" data-a="filters" style="width:100%">조건 바꾸기</button>`
               : `<button class="btn btn--text" type="button" data-a="next" style="width:100%;margin-top:4px">다른 맛집 보기</button>`}
      </article>`;
      announce(`${r.n} 맛집을 추천했어요.`);
    }
    $$("[data-a]", res).forEach(b => b.onclick = () => ({
      reg: () => go("register"), filters: toFilters, next: pick,
      detail: () => go("detail", {rid:cur.id}),
    })[b.dataset.a]());
  }
  function pick(first){
    shownFor = key();
    if(!cands.length){ cur = null; render(null); }
    else if(cands.length === 1){ cur = cands[0]; render(cur, true); }
    else { const pool = cands.filter(r => r !== cur); cur = pool[Math.floor(Math.random() * pool.length)]; render(cur); }
    if(first === true) $("#res").scrollIntoView({behavior:"smooth", block:"start"});
  }
  $("#go").onclick = () => { const b = $("#go"); busy(b, "조건에 맞는 맛집을 찾고 있어요."); setTimeout(() => { unbusy(b); pick(true); }, 350); };
  summary();
  if(args.cur){ cur = getR(args.cur); if(cur && ready()){ shownFor = key(); render(cur, cands.length === 1); } }
  $("#res").addEventListener("click", () => { current.args.cur = cur?.id; }, true);
  screenRefresh = () => { if(ready()) { const n = match().length; if(n !== cands.length) summary(); } };
},

/* ---------------- S04 족보 커뮤니티 ---------------- */
detail({rid}){
  const r = getR(rid);
  if(!r){
    view.innerHTML = `<section class="screen">${topbar("족보 커뮤니티")}<div class="card state">${icon("alert-circle","ico state__icon")}
      <h1 class="t-heading">이 맛집 정보를 확인할 수 없어요.</h1><button class="btn btn--secondary" type="button" id="h" style="width:auto;padding:0 24px">홈으로 돌아가기</button></div></section>`;
    bindCommon(); $("#h").onclick = () => { S.stack = []; go("home", {}, false); }; return;
  }
  let page = 20;
  view.innerHTML = `<section class="screen">
    ${topbar("족보 커뮤니티")}
    <div class="head"><h1 class="t-title">${esc(r.n)}</h1>
      <p class="t-caption" style="margin:0">${esc(regionName(r.rg))} · ${esc(r.c)}${r.a ? ` · ${esc(r.a)}` : ""}</p></div>
    <div class="card info-card">
      <div class="info-lines">
        ${r.m ? `<div class="info-line">${icon("utensils")}추천 메뉴 · ${esc(r.m)}</div>` : ""}
        <div class="info-line num">${icon("wallet")}${priceLine(r)}</div>
        ${r.wk && r.bp ? `<div class="info-line num">${icon("footprints")}${esc(r.bp)}에서 도보 약 ${r.wk}분</div>` : ""}
        ${r.h ? `<div class="info-line num">${icon("clock")}영업시간 · ${esc(r.h)}</div><p class="t-caption" style="margin:2px 0 10px 24px">방문 전 영업시간을 확인해주세요.</p>` : `<div style="height:10px"></div>`}
      </div>
      ${mapBtn(r, "width:100%")}
      ${r.src === "kakao" ? `<p class="t-caption" style="margin:8px 0 0;text-align:center">장소 정보 출처: 카카오맵</p>` : ""}
    </div>
    <div class="stack" style="gap:6px"><h2 class="t-label">한 줄 팁</h2>
      ${r.tip ? `<div class="infobox">${esc(r.tip)}</div>` : `<div class="notice">아직 등록된 한 줄 팁이 없어요.</div>`}</div>
    <div>
      <div class="rec-row" id="rec-row"></div>
      <p class="t-caption" style="text-align:center;margin:6px 0 0">추천은 최근 3일 TOP3에 반영돼요.</p>
    </div>
    ${readOnlyNote()}
    <div class="stack" style="margin-top:var(--space-2)">
      <div class="sec-head"><h2 class="t-heading">동료들의 방문 팁</h2><span class="t-caption num" id="tip-meta"></span></div>
      ${privacy()}
      <form class="stack" id="tip-form" novalidate style="gap:var(--space-3)">
        <div class="field" id="fd-nick" data-max="10">
          <label class="field__label" for="in-nick">닉네임 <span class="field__opt">(선택)</span></label>
          <input class="input" id="in-nick" type="text" maxlength="20" placeholder="예: 야근전사 · 비우면 익명 방문자" autocomplete="nickname">
          <div class="field__meta"><span class="field__help">실명 대신 닉네임을 써주세요. 다음에도 기억해둘게요.</span><span class="field__error">${icon("alert-circle")}닉네임은 10자 이내로 작성해주세요.</span><span class="field__count num">0/10</span></div>
        </div>
        <div class="comment-form">
        <div class="field" id="fd-c" data-max="200">
          <label class="field__label" for="in-c">방문 팁 남기기</label>
          <input class="input" id="in-c" type="text" placeholder="메뉴, 대기 시간, 함께 먹기 좋은 인원 등을 알려주세요" autocomplete="off">
          <div class="field__meta"><span class="field__help"></span><span class="field__error">${icon("alert-circle")}<span id="er-c">방문 팁은 200자 이내로 작성해주세요.</span></span><span class="field__count num">0/200</span></div>
        </div>
        <button class="btn btn--primary" type="submit" id="tip-go" style="margin-top:26px"${readOnly() ? " disabled" : ""}>등록</button>
        </div>
      </form>
      <div id="tips"></div>
    </div>
  </section>`;
  bindCommon();
  const input = $("#in-c"), nick = $("#in-nick");
  bindCounter($("#fd-c"), () => { $("#er-c").textContent = "방문 팁은 200자 이내로 작성해주세요."; });
  nick.value = lsGet("sg.nick", "");
  bindCounter($("#fd-nick"), () => {});
  nick.dispatchEvent(new Event("input"));

  function renderRec(){
    const s = stats(rid), done = recToday(rid);
    $("#rec-row").innerHTML = done
      ? `<button class="btn btn--secondary" type="button" disabled>${icon("check")}오늘 추천했어요</button><span class="rec-count num">추천 ${s.tot}</span>`
      : `<button class="btn btn--secondary" type="button" id="rec" aria-label="${esc(r.n)} 추천하기"${readOnly() ? " disabled" : ""}>${icon("thumbs-up")}추천해요</button><span class="rec-count num">추천 ${s.tot}</span>`;
    const b = $("#rec"); if(!b) return;
    b.onclick = async () => {
      if(b.getAttribute("aria-busy")) return;
      if(recToday(rid)){ toast("오늘 이미 추천한 맛집이에요."); renderRec(); return; }
      busy(b, "추천 중…");
      try{ const r2 = await addRec(rid); renderRec(); toast(r2 === "dup" ? "오늘 이미 추천한 맛집이에요." : "추천했어요! 최근 3일 TOP3에 반영돼요."); }
      catch(e){ unbusy(b); toast("추천하지 못했어요. 다시 시도해주세요."); }
    };
  }
  function renderTips(){
    const st = S.mode === "remote" ? (S.tipsState.get(rid) || "loading") : "ok";
    if(st === "loading" || S.mode === "loading"){ $("#tip-meta").textContent = ""; $("#tips").innerHTML = `<p class="t-caption" role="status" style="text-align:center;margin:12px 0">맛집과 방문 팁을 불러오고 있어요.</p>`; return; }
    if(st === "error"){ $("#tips").innerHTML = `<div class="state" style="padding:20px 0">${icon("alert-circle","ico state__icon")}<p class="t-sub" style="margin:0">방문 팁을 불러오지 못했어요.</p><button class="btn btn--secondary" type="button" id="tips-retry" style="width:auto;padding:0 24px">방문 팁 다시 보기</button></div>`;
      $("#tips-retry").onclick = async () => { S.tipsState.set(rid, "loading"); renderTips(); await loadTips(rid); renderTips(); }; return; }
    const tips = tipsOf(rid);
    $("#tip-meta").textContent = `방문 팁 ${tips.length}개 · 최근 등록 순`;
    if(!tips.length){ $("#tips").innerHTML = `<div class="state" style="padding:24px 0"><span class="state__emoji" aria-hidden="true">🍽️</span><h3 class="t-heading">아직 방문 팁이 없어요.</h3><p class="t-sub" style="margin:0">첫 방문 팁을 남겨주세요.</p></div>`; return; }
    const shown = tips.slice(0, page);
    $("#tips").innerHTML = `<ul class="tip-list">${shown.map(t => { const al = t.al || ALIAS_DEFAULT; return `<li class="tip-item"><span class="avatar" aria-hidden="true">${esc([...al][0])}</span><div style="min-width:0"><div class="tip-item__head">${esc(al)} <time class="num">· ${fmt(t.ts)}</time></div><p class="tip-item__body" style="overflow-wrap:anywhere">${esc(t.x)}</p></div></li>`; }).join("")}</ul>
      ${tips.length > page ? `<button class="btn btn--text" type="button" id="more" style="display:flex;margin:4px auto 0">방문 팁 더 보기</button>` : (tips.length > 20 ? `<p class="t-caption" style="text-align:center;margin:8px 0 0">방문 팁을 모두 확인했어요.</p>` : "")}`;
    const m = $("#more"); if(m) m.onclick = () => { page += 20; renderTips(); };
  }
  $("#tip-form").onsubmit = async e => {
    e.preventDefault();
    const b = $("#tip-go"); if(b.getAttribute("aria-busy")) return;
    const text = input.value.trim(), f = $("#fd-c");
    if(!text){ $("#er-c").textContent = "방문 팁 내용을 입력해주세요."; f.classList.add("is-error"); input.focus(); return; }
    if(len(text) > 200){ f.classList.add("is-error"); return; }
    const al = nick.value.replace(/\s+/g, " ").trim();
    if(len(al) > 10){ $("#fd-nick").classList.add("is-error"); nick.focus(); return; }
    lsSet("sg.nick", al);
    busy(b, "등록 중…");
    try{ await addTip(rid, text, al); unbusy(b); input.value = ""; input.dispatchEvent(new Event("input")); renderTips(); toast("방문 팁을 등록했어요."); }
    catch(err){ unbusy(b); toast("방문 팁을 등록하지 못했어요. 내용을 유지했으니 다시 시도해주세요."); }
  };
  renderRec(); renderTips();
  if(S.mode === "remote" && S.tipsState.get(rid) !== "ok"){ S.tipsState.set(rid, "loading"); renderTips(); loadTips(rid).then(() => { if(current.name === "detail" && current.args.rid === rid) renderTips(); }); }
  screenRefresh = () => { renderRec(); renderTips(); };
},

/* ---------------- S05 검색으로 찾기 (신규) ---------------- */
all(args){
  let sort = args.sort || "near", shown = 10, q = args.q || "", cat = args.cat || "";
  const CAT_CHIPS = ["한식","중식","일식","양식","분식","기타"];
  view.innerHTML = `<section class="screen">
    ${topbar("")}
    <div class="head"><h1 class="t-title">검색으로 찾기</h1><p class="t-caption" style="margin:0">가게 이름이나 메뉴, 종류로 족보에 등록된 맛집을 찾아요.</p></div>
    <div class="field">
      <label class="sr-only" for="in-q">맛집 검색어</label>
      <input class="input" id="in-q" type="search" enterkeyhint="search" placeholder="예: 국밥, 짬뽕, 혼밥" autocomplete="off" value="${esc(q)}">
    </div>
    <div class="chips" id="cat" aria-label="종류로 찾기">${CAT_CHIPS.map(c => chipBtn(c, c, cat === c, "multi")).join("")}</div>
    <div class="sec-head" style="align-items:center;flex-wrap:wrap"><span class="t-label num" id="cnt"></span>
      <div class="chips" id="sort" role="radiogroup" aria-label="정렬">${chipBtn("near","가까운 순",sort === "near")}${chipBtn("rec","추천 많은 순",sort === "rec")}</div></div>
    <div id="list" aria-live="polite"></div>
  </section>`;
  bindCommon();
  const hay = r => norm([r.n, r.c, r.m, r.tip, r.a, String(r.g || "").split(",").map(g => lab(TAGS, g)).join(" ")].filter(Boolean).join(" "));
  function render(){
    const words = q.split(/\s+/).map(norm).filter(Boolean);
    const rows = allR().filter(r => r.rg === S.region && (!cat || r.c === cat) && words.every(w => hay(r).includes(w)))
      .map(r => ({r, s:stats(r.id)})).sort(sort === "near"
      ? (a,b) => (a.r.wk ?? 999) - (b.r.wk ?? 999) || a.r.n.localeCompare(b.r.n, "ko")
      : (a,b) => b.s.tot - a.s.tot || (a.r.wk ?? 999) - (b.r.wk ?? 999));
    const filtered = words.length || cat;
    $("#cnt").textContent = filtered ? `찾은 맛집 ${rows.length}곳` : `맛집 ${rows.length}곳`;
    if(!rows.length){
      $("#list").innerHTML = filtered
        ? `<div class="card state"><span class="state__emoji" aria-hidden="true">🍽️</span><h2 class="t-heading">찾는 맛집이 아직 족보에 없어요.</h2><p class="t-sub" style="margin:0">다른 이름이나 종류로 찾아보세요.</p><button class="btn btn--primary" type="button" id="reg">맛집 등록하기</button></div>`
        : `<div class="card state"><span class="state__emoji" aria-hidden="true">🍽️</span><h2 class="t-heading">아직 등록된 맛집이 없어요.</h2><button class="btn btn--primary" type="button" id="reg">맛집 등록하기</button></div>`;
      $("#reg").onclick = () => go("register"); return;
    }
    $("#list").innerHTML = `<div class="card"><ul class="all-list">${rows.slice(0, shown).map(({r,s}) => {
      const meta = [r.wk && r.bp ? `${esc(r.bp)}에서 도보 약 ${r.wk}분` : null, priceLine(r), r.m ? esc(r.m) : null].filter(Boolean).join(" · ");
      return `<li class="all-item"><button type="button" class="all-item__btn" data-rid="${esc(r.id)}" aria-label="${esc(r.n)}, ${meta}, 추천 ${s.tot}">
        <span class="all-item__body"><span class="all-item__name"><span>${esc(r.n)}</span><span class="badge">${esc(r.c)}</span></span><span class="all-item__meta num">${meta}</span></span>
        <span class="all-item__rec num"${s.tot ? "" : ' style="color:var(--color-text-sub);font-weight:600"'}>추천 ${s.tot}</span>${icon("chevron-right")}</button></li>`; }).join("")}</ul></div>
      ${shown < rows.length ? `<button class="btn btn--text" type="button" id="more" style="display:flex;margin:4px auto 0">더 보기</button>` : ""}`;
    $$("[data-rid]", view).forEach(b => b.onclick = () => go("detail", {rid:b.dataset.rid}));
    const m = $("#more"); if(m) m.onclick = () => { shown += 10; render(); };
  }
  let t;
  $("#in-q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value; current.args.q = q; shown = 10; render(); }, 150); });
  $("#in-q").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); e.target.blur(); } });
  /* 종류 칩: 하나만 고르고, 다시 누르면 해제 */
  $("#cat").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if(!c) return;
    cat = cat === c.dataset.v ? "" : c.dataset.v; current.args.cat = cat;
    $$("#cat .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === cat)); shown = 10; render();
  });
  bindChipGroup($("#sort"), v => { sort = v; current.args.sort = v; shown = 10; render(); });
  render(); screenRefresh = render;
}
};

/* 글자 수 카운터 */
function bindCounter(f, onVal){
  const input = $(".input", f), count = $(".field__count", f), max = +f.dataset.max;
  input.addEventListener("input", () => {
    const n = len(input.value), over = n > max;
    count.textContent = `${n}/${max}`; count.classList.toggle("is-over", over);
    f.classList.toggle("is-error", over); input.setAttribute("aria-invalid", over);
    onVal(input.value);
  });
}

go("home", {}, false);
boot();
</script>
